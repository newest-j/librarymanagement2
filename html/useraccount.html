<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="/style/useraccount.css">
</head>

<body>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar d-flex flex-column">
                <h4 class="mb-4 text-danger">Libra</h4>
                <a href="userdashboard.html">Home</a>
                <a href="usersearch.html">Search</a>
                <a href="usershelf.html">My Shelf</a>
                <a href="useraccount.html">My Account</a>
                <button id="signout" class="btn btn-primary">Signout</button>
            </div>

            <!-- Main Content -->
            <div class="col-md-10">
                <!-- Topbar -->
                <div class="topbar d-flex justify-content-between align-items-center mb-4 p-2">

                    <span id="date"> 2023-04-27</span>
                   
                </div>

                <!-- Profile Card -->
                <div class="card shadow p-4">
                    <div class="row">
                        <div class="col-md-4 text-center mb-4">
                            <img id="profileImage" src="/images/profile.jpg" class="rounded-circle mb-3" width="150" height="150"
                                alt="User Profile Picture">
                            <h5 id="name"></h5>
                            <p id="mail"></p>
                            <p ><strong>Books Borrowed: </strong><span id="booksaved">0</span> </p>
                        </div>
                        <div class="col-md-8">
                            <h5 class="mb-3">Update Profile</h5>
                            <form>
                                <div class="mb-3">
                                    <label for="fullName" class="form-label">Full Name</label>
                                    <input type="text" class="form-control" id="fullName" value="">
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email address</label>
                                    <input type="email" class="form-control" id="email" value="">
                                </div>

                                <div class="mb-3">
                                    <label for="profilePic" class="form-label">Profile Picture</label>
                                    <input type="file" class="form-control" id="profilePic">
                                </div>
                                <button type="submit" id="submit" class="btn btn-primary">Update Profile</button>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="/script/useraccount.js" type="module"></script>
</body>

</html>
